<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Amplify</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bayon&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html">
      <img class="logo" src="images/Amplify (purple 2) 2.png" alt="Amplify logo">
    </a>
    <nav class="site-nav">
      <ul class="nav-list nav-list-left">
        <li><a class="nav-link" href="index.html">Schedule</a></li>
        <li><a class="nav-link" href="roster.html">Music Rumble</a></li>
        <li><a class="nav-link" href="sign-up.html">Sign-Up</a></li>
        <li><a class="nav-link" href="#">Merch</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="tickets-hero">
      <h1 class="tickets-title">Tickets</h1>
    </section>

    <section class="checkout-card">
      <form class="card-form">
        <h2 class="card-title">Card information</h2>
        <input class="card-input" type="text" placeholder="Card number">
        <input class="card-input" type="text" placeholder="Expiration date">
        <input class="card-input" type="text" placeholder="Security code">
      </form>

      <p class="or-text">or</p>

      <a class="paypal-button" href="#">
        <img class="paypal-logo" src="images/image 4.png" alt="PayPal">
      </a>
    </section>

    <a class="back-button" href="tickets.html">&larr;</a>

  </main>

  <footer class="site-footer checkout-footer">
    <a class="about-link" href="about.html">About</a>
  </footer>

</html>
